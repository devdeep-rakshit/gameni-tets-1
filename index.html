<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 CuteMeter 💖</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>CuteMeter 3000</h1>
            <p>Scanning facial aesthetics...</p>
        </div>
        
        <div class="scanner-wrapper">
            <video id="cameraFeed" autoplay playsinline muted></video>
            
            <!-- Skin overlays -->
            <div class="scan-line"></div>
            <div class="frame-corner top-left"></div>
            <div class="frame-corner top-right"></div>
            <div class="frame-corner bottom-left"></div>
            <div class="frame-corner bottom-right"></div>
        </div>

        <div id="complimentDisplay" class="compliment-text">
            Initializing camera for analysis...
        </div>

        <!-- Hidden Developer Status Log -->
        <div id="statusLog" style="display: none;"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
